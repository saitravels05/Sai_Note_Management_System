name: Production Quality & Automated Testing Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-gate:
    name: Complete Automated Testing Suite & Deployment Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: sai_accounting_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/sai_accounting_test?schema=public
      JWT_SECRET: ci_test_jwt_secret_must_be_at_least_32_characters_long_for_security_12345
      SYSTEM_MODE: NORMAL

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client & Migrate Test DB
        run: |
          npx prisma generate
          npx prisma db push --skip-generate

      - name: Layer 0 — TypeScript Strict Type Checking
        run: npm run typecheck

      - name: Layer 0 — ESLint Verification
        run: npm run lint

      - name: Layer 1 & 2 — Unit & Financial Math Tests
        run: npm run test:unit

      - name: Layer 2 & 8 — Golden Accounting Dataset & Decimal Precision
        run: npm run test:accounting

      - name: Layer 3 & 8 — Database Integration & Month-End Regressions
        run: npm run test:integration

      - name: Layer 5 — Security, RBAC & Multi-Tenant Isolation
        run: npm run test:security

      - name: Layer 2 — AI Assistant Structured Guardrails
        run: npm run test:ai

      - name: Layer 2 — Month-End Closing Engine
        run: npm run test:month-end

      - name: Run Full Node Test Suite (274+ Tests)
        run: npm test

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build Next.js Application
        run: npm run build

      - name: Start Production Server for E2E
        run: |
          npm run start &
          npx wait-on http://127.0.0.1:3000

      - name: Layer 6 & 7 — Playwright E2E & Mobile Responsive Matrix
        run: npm run test:e2e

      - name: Upload Playwright Test Report on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
